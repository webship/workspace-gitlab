# Labels for core/config/plugin.gitlab.settings.yml, merged into the Settings page.
host:
  label: Host
  info: 'The GitLab instance: git.drupalcode.org (drupal.org''s), gitlab.com, or your own.'
username:
  label: Username
  info: 'The account name that GitLab knows you by.'
email:
  label: Commit email
  info: 'The address commits pushed there carry. Blank falls back to contributor.email.'
token:
  label: Token
  info: 'A personal access token (Preferences → Access tokens) with read_api; api for merge requests from the dashboard. Read by glab as GITLAB_TOKEN.'
scheme:
  label: Protocol
  info: 'https, or http for a GitLab of your own served without TLS on a local address (http://127.0.0.1:8929). Every URL the plugin builds uses it.'
  options:
    https: "https (default)"
    http: "http (a local instance)"
tracker.allow_writes:
  label: Writes to GitLab (issues as work items)
  info: 'Off: the AI works on a branch and nothing leaves this machine. On: you may push the branch and open a draft merge request, add notes and worklogs, close, move, label and assign, each a click after a preview, each a line in actions.log.'
  options:
    "false": "Off — nothing is written to GitLab (default)"
    "true": "On — each write is your click after a preview"
tracker.max_agents:
  label: Author sessions at once
  info: 'How many AI sessions may work issues at the same time. Each is a whole session in a project.'
  number: { min: 1, max: 8, step: 1 }
tracker.default_scope:
  label: Default project for issues
  info: 'group/name: the project a workspace project works against when its own remote is not on this GitLab and it remembers none.'
tracker.scopes:
  label: Projects the issues list may switch to
  info: 'A list of group/name. Empty is any. Edit it in the Raw YAML tab.'
tracker.work_in:
  label: Where the AI works
  info: 'A new branch in the project (a running site shows the change), or a git worktree outside the workspace folders (the project stays as it is).'
  options:
    branch: "A branch in the project (default)"
    worktree: "A worktree outside the workspace folders"
tracker.sandbox:
  label: Sandbox for the author session
  info: 'Required: Claude Code''s sandboxed Bash (no network, credentials denied), and no session without it. On Ubuntu 24.04 bubblewrap needs its AppArmor profile (see the tracker''s README). Off: your choice, said in the form.'
  options:
    required: "Required (default)"
    "off": "Off — the session is not sandboxed"
tracker.network_domains:
  label: Domains the sandbox allows
  info: 'The package registries the project needs (registry.npmjs.org, repo.packagist.org…). None by default. Edit it in the Raw YAML tab.'
tracker.allow_web:
  label: Web tools in the author session
  info: 'WebFetch and WebSearch. Off by default: a link in an issue is not opened.'
  options:
    "false": "Off (default)"
    "true": "On"
tracker.comments_from:
  label: Comments the AI reads
  info: 'Members: only notes by Developers and above of the project (default). All, or none.'
  options:
    members: "Developers and above (default)"
    all: "All comments"
    none: "No comments"
tracker.outsider_items:
  label: Issues from outside the project
  info: 'Opened, or last edited, by someone below Developer (Guests and Reporters included). Analyze: analyze only, unless you tick a confirmation that names them. Refuse: analyze only.'
  options:
    analyze: "Analyze only, unless confirmed by name (default)"
    refuse: "Analyze only"
tracker.draft:
  label: Draft merge requests
  info: 'Open the merge request as a draft, so it cannot be merged by accident.'
  options:
    "true": "Drafts (default)"
    "false": "Ready for review"
