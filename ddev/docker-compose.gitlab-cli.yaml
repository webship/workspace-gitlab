# The glab CLI and its config, shared FROM THE HOST: the bin DIRECTORY is mounted, not the file,
# so an update on the host is live in the container at once.
services:
  web:
    volumes:
      - "${HOME}/.local/bin:/host-local-bin:ro"
      - "${HOME}/.config/glab-cli:/home/${USER}/.config/glab-cli:rw"
